name: Update Premier League data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh fixture snapshot
        run: npm run update-data
      - name: Validate data
        run: npm run check
      - name: Commit changes
        run: |
          if git diff --quiet -- data/fpl.json; then
            echo "FPL data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fpl.json
          git commit -m "chore: refresh Premier League data"
          git push
